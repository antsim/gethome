[package]
name = "tyoaikalaskuri"
version = "0.1.0"
description = "Menu bar app that shows how much of today's working time is left, based on Toggl Track"
authors = ["Antti Simonen"]
license = "MIT"
repository = "https://github.com/antsim/gethome"
edition = "2021"
rust-version = "1.82"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "tyoaikalaskuri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-clipboard-manager = "2.5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
thiserror = "2"
url = "2"
keyring = "4"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
